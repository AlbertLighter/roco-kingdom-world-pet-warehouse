# 可选。nginx 对外，应用继续听 127.0.0.1:8000，不必设置 ROCO_HOST=0.0.0.0。
# 同步进度是 SSE，这里关掉代理缓冲并放长读超时。
# 安装示例：
#   sudo cp deploy/nginx-roco-warehouse.conf /etc/nginx/sites-available/roco-warehouse.conf
#   sudo ln -s /etc/nginx/sites-available/roco-warehouse.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 没有 sites-available 的镜像，改放到 /etc/nginx/conf.d/roco-warehouse.conf。
# 证书沿用机器上已有的签发方式。需要 HTTPS 时再加 listen 443 ssl 和证书路径。

server {
    listen 80;
    server_name warehouse.example.com;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
