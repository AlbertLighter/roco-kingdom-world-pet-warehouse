<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国：世界 抓包记录</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        body.page-packets { background: #f4f7f6; }
        .packet-layout { display: grid; grid-template-columns: minmax(320px, 42%) 1fr; gap: 16px; align-items: start; }
        .packet-panel { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 14px; }
        .packet-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .packet-toolbar input, .packet-toolbar select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .packet-table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
        .packet-table th, .packet-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
        .packet-table tr { cursor: pointer; }
        .packet-table tr.active { background: #e8f8f5; }
        .packet-table tr:hover { background: #f7fbfa; }
        .dir-s2c { color: #148f77; font-weight: 700; }
        .dir-c2s { color: #2980b9; font-weight: 700; }
        .packet-detail pre { white-space: pre-wrap; word-break: break-all; background: #1e272e; color: #ecf0f1; padding: 12px; border-radius: 6px; max-height: 420px; overflow: auto; font-size: 12px; }
        .packet-meta { display: grid; grid-template-columns: 88px 1fr; gap: 4px 8px; font-size: 0.92em; margin-bottom: 10px; }
        .packet-meta span { color: #7f8c8d; }
        @media (max-width: 900px) { .packet-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="page page-packets">
    <header class="app-header">
        <div class="header-eyebrow">PACKET LOG</div>
        <h1>抓包记录</h1>
        <p class="header-subtitle">改道读取游戏连接，查看解密后的消息，解析字段，再序列化成 JSON。需要管理员启动服务，先点记录再进游戏。</p>
        <div class="header-actions" style="margin-top: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <a href="index.html" style="text-decoration: none; display: inline-block; background: #7f8c8d; color: white; padding: 10px 20px; border-radius: 4px;">← 返回仓库</a>
        </div>
    </header>
    <main>
        <div class="packet-panel" style="margin-bottom: 16px;">
            <div class="packet-toolbar">
                <button id="importBtn" type="button" style="padding: 8px 14px; background: #1abc9c; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">载入 data 导出</button>
                <input id="seconds" type="number" min="10" max="600" value="120" style="width: 72px;" title="最长秒数">
                <button id="recordBtn" type="button" style="padding: 8px 14px; background: #b9770e; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">改道记录</button>
                <input id="pcapPath" type="text" placeholder="pcap 路径" style="min-width: 180px;">
                <button id="replayBtn" type="button" style="padding: 8px 14px; background: #0e6655; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">回放并记录</button>
                <button id="clearBtn" type="button" style="padding: 8px 14px; background: #c0392b; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">清空</button>
            </div>
            <div id="jobLog" style="font-size: 0.9em; color: #34495e; min-height: 1.2em;"></div>
        </div>
        <div class="packet-layout">
            <section class="packet-panel">
                <div class="packet-toolbar">
                    <select id="direction">
                        <option value="">全部方向</option>
                        <option value="s2c">s2c 下行</option>
                        <option value="c2s">c2s 上行</option>
                    </select>
                    <input id="opcode" type="text" placeholder="opcode 或名称" style="width: 140px;">
                    <input id="query" type="text" placeholder="摘要 / 连接" style="width: 140px;">
                    <button id="searchBtn" type="button" style="padding: 8px 12px; background: #3498db; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">筛选</button>
                </div>
                <table class="packet-table">
                    <thead>
                        <tr><th>时间</th><th>方向</th><th>消息</th><th>摘要</th></tr>
                    </thead>
                    <tbody id="packetBody"></tbody>
                </table>
                <div style="margin-top: 10px; display: flex; gap: 8px; align-items: center;">
                    <button id="prevBtn" type="button">上一页</button>
                    <span id="pageInfo">第 1 页</span>
                    <button id="nextBtn" type="button">下一页</button>
                </div>
            </section>
            <section class="packet-panel packet-detail">
                <h2 id="detailTitle" style="margin-top: 0;">选择一条消息</h2>
                <div id="detailMeta" class="packet-meta"></div>
                <div class="packet-toolbar">
                    <button id="parseBtn" type="button" disabled style="padding: 8px 14px; background: #2980b9; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">解析</button>
                    <button id="serializeBtn" type="button" disabled style="padding: 8px 14px; background: #8e44ad; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">序列化</button>
                    <button id="copyBtn" type="button" disabled style="padding: 8px 14px; background: #7f8c8d; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">复制 JSON</button>
                    <button id="downloadBtn" type="button" disabled style="padding: 8px 14px; background: #7f8c8d; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">下载 JSON</button>
                    <button id="applyBtn" type="button" disabled style="padding: 8px 14px; background: #27ae60; color: #fff; border: 0; border-radius: 4px; cursor: pointer;">写入精灵库</button>
                </div>
                <pre id="detailView">解析结果和序列化 JSON 会显示在这里。解析把载荷展开成字段；序列化再收成一份可保存的 JSON。</pre>
            </section>
        </div>
    </main>
    <script src="packets.js?v=1"></script>
</body>
</html>
