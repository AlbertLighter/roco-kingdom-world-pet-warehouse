<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国：世界 宠物仓库</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app">
        <header>
            <h1>洛克王国：世界 宠物仓库</h1>
            <div id="refreshTimeDisplay" style="font-size: 0.9em; color: rgba(255,255,255,0.8); margin: 5px 0;">
                🕐 宠物刷新时间：<span id="refreshTimeValue">加载中...</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索宠物名称...">
                <button id="searchBtn">搜索</button>
            </div>
            <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px; align-items: center;">
                <a href="breeding.html" class="nav-btn" style="text-decoration: none; display: inline-block; background: #3498db; color: white; padding: 10px 20px; border-radius: 4px;">进入繁育中心</a>
                <a href="release.html" class="nav-btn" style="text-decoration: none; display: inline-block; background: #e74c3c; color: white; padding: 10px 20px; border-radius: 4px;">放生推荐</a>
                <button id="configSpeciesBtn" style="padding: 10px 20px; background: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">⚙️ 品种偏好</button>
                <button id="syncBtn" style="padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">同步精灵</button>
                <button id="syncGenderBtn" style="padding: 10px 20px; background: #8e44ad; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">同步性别</button>
            </div>
            <div id="syncProgress" style="display: none; margin-top: 12px; padding: 0 20px;">
                <div style="background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; height: 22px; position: relative;">
                    <div id="syncProgressBar" style="height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); width: 0%; transition: width 0.3s ease; border-radius: 4px;"></div>
                    <span id="syncProgressText" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.85em; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">0%</span>
                </div>
                <div id="syncLog" style="margin-top: 8px; max-height: 120px; overflow-y: auto; font-size: 0.85em; color: rgba(255,255,255,0.85); text-align: left; padding: 0 4px;"></div>
            </div>
            <div id="syncGenderProgress" style="display: none; margin-top: 12px; padding: 0 20px;">
                <div style="background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; height: 22px; position: relative;">
                    <div id="syncGenderProgressBar" style="height: 100%; background: linear-gradient(90deg, #9b59b6, #8e44ad); width: 0%; transition: width 0.3s ease; border-radius: 4px;"></div>
                    <span id="syncGenderProgressText" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.85em; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">0%</span>
                </div>
                <div id="syncGenderLog" style="margin-top: 8px; max-height: 120px; overflow-y: auto; font-size: 0.85em; color: rgba(255,255,255,0.85); text-align: left; padding: 0 4px;"></div>
            </div>
        </header>

        <main>
            <div id="petList" class="pet-grid">
                <!-- 宠物卡片将在这里动态生成 -->
            </div>
            <div class="pagination">
                <button id="prevBtn">上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button id="nextBtn">下一页</button>
            </div>
        </main>
    </div>

    <!-- 全局品种配置弹窗 -->
    <div id="globalConfigModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>品种偏好配置</h2>
                <button id="closeGlobalConfigBtn" style="background:none;border:none;font-size:1.5em;cursor:pointer;">×</button>
            </div>
            <div class="modal-body">
                <table class="config-table">
                    <thead>
                        <tr>
                            <th>品种名称</th>
                            <th>偏好性格<br><small>点击选</small></th>
                            <th>最少保留</th>
                        </tr>
                    </thead>
                    <tbody id="globalConfigTableBody">
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button id="saveGlobalConfigBtn" style="padding: 10px 30px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">保存全部</button>
                <button id="cancelGlobalConfigBtn" style="padding: 10px 30px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-left: 10px;">取消</button>
            </div>
        </div>
    </div>

    <!-- 品种单配弹窗 -->
    <div id="speciesConfigModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="speciesConfigTitle">品种配置</h2>
                <button id="closeSpeciesModalBtn" style="background:none;border:none;font-size:1.5em;cursor:pointer;">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>偏好性格 (点击选取):</label>
                    <div id="speciesNatureContainer" class="nature-tag-grid"></div>
                </div>
                <div class="form-group">
                    <label>最少保留 (不含特长):</label>
                    <input type="number" id="speciesKeepCount" value="3" min="1" max="99" style="width: 80px; padding: 6px;">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSpeciesConfigBtn" style="padding: 10px 30px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">保存</button>
                <button id="cancelSpeciesConfigBtn" style="padding: 10px 30px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-left: 10px;">取消</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
