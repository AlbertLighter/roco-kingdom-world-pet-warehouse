<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国：世界 放生推荐</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app">
        <header>
            <h1>洛克王国：世界 · 放生推荐</h1>
            <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap;">
                <a href="index.html" class="nav-btn" style="text-decoration: none; display: inline-block; background: #7f8c8d; color: white; padding: 10px 20px; border-radius: 4px;">← 返回仓库</a>
                <button id="refreshBtn" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">🔄 重新评估</button>
                <button id="configBtn" style="padding: 10px 20px; background: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">⚙️ 配置偏好</button>
            </div>
        </header>

        <main>
            <!-- 概览统计 -->
            <div id="summaryArea" class="release-summary">
                <div class="summary-loading">加载中...</div>
            </div>

            <!-- 筛选栏 -->
            <div class="release-filter-bar">
                <span>品种筛选:</span>
                <select id="speciesFilter">
                    <option value="">全部品种</option>
                </select>
                <span style="margin-left: 15px;">最低评分:</span>
                <input type="number" id="minScoreFilter" value="0" min="0" max="100" style="width: 60px; padding: 4px;">
                <span style="margin-left: 15px;">显示:</span>
                <select id="displayFilter">
                    <option value="all">全部</option>
                    <option value="recommended">仅推荐放生</option>
                    <option value="kept">仅保留</option>
                </select>
            </div>

            <!-- 推荐列表 -->
            <div id="releaseList">
                <!-- 按品种分组的推荐列表 -->
            </div>

            <!-- 分页 -->
            <div class="pagination">
                <button id="prevBtn">上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button id="nextBtn">下一页</button>
            </div>
        </main>
    </div>

    <!-- 配置弹窗 -->
    <div id="configModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>品种偏好配置</h2>
                <button id="closeModalBtn" style="background:none;border:none;font-size:1.5em;cursor:pointer;">×</button>
            </div>
            <div class="modal-body">
                <table class="config-table">
                    <thead>
                        <tr>
                            <th>品种名称</th>
                            <th>偏好性格<br><small>Ctrl多选</small></th>
                            <th>最少保留</th>
                        </tr>
                    </thead>
                    <tbody id="configTableBody">
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button id="saveConfigBtn" style="padding: 10px 30px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">保存全部</button>
                <button id="cancelConfigBtn" style="padding: 10px 30px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-left: 10px;">取消</button>
            </div>
        </div>
    </div>

    <!-- 品种单配弹窗 -->
    <div id="speciesConfigModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="speciesConfigTitle">品种配置</h2>
                <button id="closeSpeciesModalBtn" style="background:none;border:none;font-size:1.5em;cursor:pointer;">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>偏好性格 (按住 Ctrl 多选):</label>
                    <select id="speciesNatureSelect" multiple size="8">
                        <option value="0">不指定</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>最少保留 (不含特长):</label>
                    <input type="number" id="speciesKeepCount" value="3" min="1" max="99" style="width: 80px; padding: 6px;">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSpeciesConfigBtn" style="padding: 10px 30px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">保存</button>
                <button id="cancelSpeciesConfigBtn" style="padding: 10px 30px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-left: 10px;">取消</button>
            </div>
        </div>
    </div>

    <script src="release.js?v=1"></script>
</body>
</html>
